{{- $p := .page -}}
<a class="postrow" href="{{ $p.Permalink }}">
  <span class="num">{{ printf "%02d" .num }}</span>
  <div class="pmid">
    <span class="ptitle">{{ $p.Title }}</span>
    {{- range $p.Params.projects }}
      {{- with site.GetPage (printf "/projects/%s" .) }}
      <span class="proj-chip"><span class="di">◇</span> {{ replaceRE `^https?://(www\.)?` "" .Title }}</span>
      {{- end }}
    {{- end }}
  </div>
  <span class="pdate">{{ $p.Date.Format "Jan 2, 2006" }}</span>
</a>

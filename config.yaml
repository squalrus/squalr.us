baseURL: https://squalr.us/
title: Chad Schulz
theme: squalr
pagination:
  pagerSize: 15
ignoreErrors: ['error-remote-getjson','shortcode-twitter-getremote']

locale: en-us
enableRobotsTXT: true
enableGitInfo: true

services:
  googleAnalytics:
    id: G-82PM3D1H9N

taxonomies:
  tag: tags
  tech: tech

permalinks:
  blog: /:year/:month/:slug/
  projects: /projects/:slug/

params:
  author: 'Chad Schulz'
  description: 'Sr Consultant at Dura Digital. Building tools, breaking prod, learning out loud.'
  favicon: '/img/favicon.ico'
  images:
    - img/bio.jpg
  # Homepage hero. Wrap a word in {curly braces} to make it the lit neon word.
  hero:
    kicker: 'HOME OF'
    lines:
      - '{SQUALRUS}'

  social:
    - icon: 'github'
      url: 'https://github.com/squalrus'
    - icon: 'twitter'
      url: 'https://x.com/chadschulz'
    - icon: 'linkedin'
      url: 'https://www.linkedin.com/in/chadschulz/'

menu:
  main:
    - identifier: 'home'
      name: 'Home'
      url: '/'
      weight: 10
    - identifier: 'blog'
      name: 'Blog'
      url: '/blog/'
      weight: 15
    - identifier: 'projects'
      name: 'Projects'
      url: '/projects/'
      weight: 20
    - identifier: 'about'
      name: 'About'
      url: 'https://github.com/squalrus'
      weight: 30
    - identifier: 'tags'
      name: 'Tags'
      url: '/tags/'
      weight: 40
    - identifier: 'chillout'
      name: 'Chillout'
      url: '/chillout-with-chad/'
      weight: 50

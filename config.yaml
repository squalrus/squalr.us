baseURL: https://squalr.us/
title: Chad Schulz
theme: squalr
pagination:
  pagerSize: 15
ignoreErrors: ['error-remote-getjson','shortcode-twitter-getremote']

locale: en-us
enableRobotsTXT: true
enableGitInfo: true

services:
  googleAnalytics:
    id: G-82PM3D1H9N

taxonomies:
  tag: tags
  tech: tech

permalinks:
  blog: /:year/:month/:slug/
  projects: /projects/:slug/

params:
  author: 'Chad Schulz'
  description: 'Sr Consultant at Dura Digital. Building tools, breaking prod, learning out loud.'
  avatar: '/img/bio.jpg'
  menu_item_separator: '//'
  favicon: '/img/favicon.ico'
  images:
    - img/bio.jpg
  # Cyberpunk palette — teal / cyan / ember on blue near-black
  style:
    bg: '#0a0e12'
    bg2: '#0c1219'
    ink: '#e8f1f4'
    accent: '#2ee6c8'      # teal — primary neon
    accent2: '#37c0ff'     # cyan — links / secondary
    accentWarm: '#ff8a3c'  # ember — the "fun" punctuation

  # Homepage hero. Heading is `lines` (each item is a line); wrap a word in
  # {curly braces} to make it the lit neon word, and end a line with `.` for
  # the ember dot. Same {…} highlight works in `subtitle`.
  hero:
    kicker: '2026'
    lines:
      - '{SQUALRUS}'
    subtitle: 'Sr Consultant at Dura Digital. Building tools, breaking prod, {learning out loud}.'
    status: 'shipping'
    flavorChip: 'hotdogs/wk ∞'

  dateFormat: 'Monday, January 2, 2006'

  social:
    - icon: 'github'
      url: 'https://github.com/squalrus'
    - icon: 'twitter'
      url: 'https://x.com/chadschulz'
    - icon: 'linkedin'
      url: 'https://www.linkedin.com/in/chadschulz/'

menu:
  main:
    - identifier: 'home'
      name: 'Home'
      url: '/'
      weight: 10
    - identifier: 'blog'
      name: 'Blog'
      url: '/blog/'
      weight: 15
    - identifier: 'projects'
      name: 'Projects'
      url: '/projects/'
      weight: 20
    - identifier: 'about'
      name: 'About'
      url: 'https://github.com/squalrus'
      weight: 30
    - identifier: 'tags'
      name: 'Tags'
      url: '/tags/'
      weight: 40
    - identifier: 'chillout'
      name: 'Chillout'
      url: '/chillout-with-chad/'
      weight: 50

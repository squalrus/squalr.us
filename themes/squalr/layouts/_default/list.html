{{ define "main" }}
<div class="page-container">
  <h1 class="page-title">{{ .Title }}</h1>
  <div class="postrows">
    {{ range $i, $p := where .Paginator.Pages "Type" "!=" "page" }}
      {{ partial "post-row.html" (dict "page" $p "num" (add $i 1)) }}
    {{ end }}
  </div>
  {{ partial "pagination.html" $ }}
</div>
{{ end }}

{{ define "main" }}
  <h1 class="page-title">{{ .Title }}</h1>
  {{- with .Content }}<div class="post-content">{{ . }}</div>{{ end }}
  <ul class="posts">
    {{ range where .Paginator.Pages "Type" "!=" "page" }}
      {{ partial "post-li.html" (dict "page" .) }}
    {{ end }}
  </ul>
  {{ partial "pagination.html" $ }}
{{ end }}

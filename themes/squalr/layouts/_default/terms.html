{{ define "main" }}
  <h1 class="page-title">{{ .Title }}</h1>
  <p class="page-subtitle">pick a tag, surf the archive »</p>
  <ul class="tags-list">
    {{ range .Data.Terms.ByCount }}
      <li class="tags-list-item">
        <a class="tag tag--large" href="{{ .Page.RelPermalink }}">{{ .Page.Title }} ({{ .Count }})</a>
      </li>
    {{ end }}
  </ul>
{{ end }}
